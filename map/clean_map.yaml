image: clean_map.pgm
mode: trinary
# Origin/resolution taken from the map's own capture-time yaml (src/my_map.yaml,
# 2026-07-25) -- the .pgm here is byte-identical to that capture, only the
# metadata was ever wrong. Replaces an earlier origin ([-4.21, -6.05]) that was
# least-squares fitted against ARCC26 rather than measured, and was off by
# roughly (+0.02, +0.18) m. That error showed up as a north-east shift of every
# mapped feature relative to the sim world, which made the field's symmetric
# structures read as asymmetric (upper_mid/lower_mid at +2.67/-2.31 instead of
# the true +/-2.49) and injected a constant offset into every map-frame pose.
# Verified against the field mesh (sim/world/composite_part_1.stl): with these
# values, mapped feature centroids match the mesh to ~0.01 m in y and a uniform
# +0.08 m in x -- that residual is the same magnitude as the mesh's own
# collision/visual pose offset in ARCC_Field_2026.sdf (-0.0799 m in x), so the
# map appears aligned to the field model's origin rather than to the displaced
# mesh. Worth resolving separately if x-axis localization bias matters.
resolution: 0.02
origin: [-4.230545, -6.230545, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.196
